name: Release

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Existing tag/ref to build and publish (e.g. v0.1.0.dev1). Leave blank for a normal tag-triggered release."
        required: false
        default: ""
      create_github_release:
        description: "Also sign with Sigstore and create a GitHub Release (which triggers the Zenodo deposit) for this tag. Default false: PyPI publish only, for republishing an already-released tag without creating a duplicate GitHub Release. auto-tag-release.yml sets this true when it dispatches a new version's first release."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Serialize every run that can publish the same release version, end to end.
#
# Without this, two runs for the same not-yet-published version can both see
# ABSENT, build byte-different artifacts, both pass the pre-upload hash check
# (which finds nothing published to compare against), and then upload
# concurrently. twine's --skip-existing decides per file, so the wheel from one
# build and the sdist from the other can both land, leaving PyPI holding
# immutable artifacts from two different builds. The post-publication check
# would then only report the corruption after it is permanent.
#
# The key is the effective release target, normalized so a tag push and a
# workflow_dispatch aimed at the same version share it:
#   push of tag v0.1.0.dev5 -> github.event.inputs is null, github.ref_name is
#                              "v0.1.0.dev5"
#   dispatch ref=v0.1.0.dev5 -> the input wins, also "v0.1.0.dev5"
# github.ref_name, not github.ref: github.ref would be "refs/tags/v0.1.0.dev5"
# on the push and "v0.1.0.dev5" on the dispatch, which are different strings
# and would not serialize against each other. (The build job's checkout can use
# github.ref because there both spellings resolve to the same commit; a
# concurrency key is compared as a literal string, so it needs the normalized
# form.) A different version yields a different group and is never blocked.
#
# A concurrency group can only key on the ref, while the version that reaches
# PyPI comes from pyproject.toml at whatever commit was checked out. Those are
# only in bijection if every run that can publish is named exactly for the
# version it publishes, so the build job asserts that before building: first
# that the target is a v<version> tag at all, then that it equals "v" plus this
# commit's version. Without the first, a dispatch that left `ref` blank would
# key on the branch name while building the very version main's pyproject.toml
# holds. Without the second, an alias tag like v0.1.0.dev5-retry on the same
# commit would pass the shape check and key a different group for one version.
# Either would race the tag-keyed run straight through to publication.
#
# cancel-in-progress is false on purpose: a second same-version run waits,
# never cancels a run that may already be mid-publication. Only one run is kept
# pending per group, so a third same-version run displaces the waiting second;
# that errs toward doing less, never toward two concurrent publications.
# Workflow level, not job level, so the lock spans reconciliation through
# publication and signing rather than only the upload.
#
# Known limit, inherent to Actions rather than to this block: a run started
# against an existing tag executes that tag's copy of this file, and tags cut
# before this landed have no concurrency block. It applies from the next tag on.
concurrency:
  group: groupoid-release-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Privilege separation: this job holds the attestation credentials, so it
  # must never install the built wheel or resolve its runtime dependency
  # graph. SBOM generation (which does both) runs in the unprivileged `sbom`
  # job; the SBOM attestation runs in `attest-sbom`, which installs nothing.
  build:
    runs-on: ubuntu-latest
    # COMPLETE means verification and adoption only. Downstream jobs read this
    # to keep an adoption run from republishing or re-releasing a version that
    # is already correct on PyPI.
    outputs:
      adopted: ${{ steps.pypi.outputs.adopted }}
    permissions:
      contents: read
      id-token: write       # provenance OIDC
      attestations: write   # actions/attest-build-provenance
    steps:
      # First, before anything is checked out or built. The concurrency group
      # above can only key on the ref, but what reaches PyPI is the version in
      # pyproject.toml at the checked-out commit. Rejecting every target that
      # is not a version tag is what keeps those two in step: after this, any
      # run that can publish is named exactly for the version it publishes, so
      # same version implies same group. A blank or branch `ref` on a dispatch,
      # or a non-canonical spelling like refs/tags/v1.2.3, dies here instead of
      # racing the tag-keyed run to the upload. sign-and-release asserts the
      # same shape again, but only after publication, which is too late to
      # protect PyPI.
      - name: Assert this run targets a version tag
        shell: bash
        env:
          RELEASE_TARGET: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          case "${RELEASE_TARGET}" in
            v[0-9]*) echo "release target: ${RELEASE_TARGET}" ;;
            *) echo "::error::refusing to build or publish for '${RELEASE_TARGET}': not a v<version> tag. Dispatch with ref set to the exact tag (e.g. v0.1.0.dev5); a blank or branch ref would publish a version this run is not named for and would not serialize against the tag's own run."; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
      # The shape check above is necessary but not sufficient: v[0-9]* also
      # matches an alias like v0.1.0.dev5-retry, which could point at the same
      # commit, build the same version, and sit in a different concurrency
      # group. This makes target and version a bijection: the tag must be
      # exactly "v" plus the version this commit will publish, so two runs that
      # publish one version necessarily share one group. Same derivation as
      # auto-tag-release.yml, which builds the tag as "v${version}" from this
      # field, so every tag that automation cuts satisfies it by construction.
      - name: Assert the tag names the version this commit publishes
        shell: bash
        env:
          RELEASE_TARGET: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = "' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ -z "${version}" ]; then
            echo "::error::could not extract a version from pyproject.toml"
            exit 1
          fi
          if [ "${RELEASE_TARGET}" != "v${version}" ]; then
            echo "::error::release target '${RELEASE_TARGET}' does not name the version this commit publishes ('${version}', so the tag must be exactly 'v${version}'). Two differently named targets building one version would land in different concurrency groups and could publish it concurrently."
            exit 1
          fi
          echo "release target ${RELEASE_TARGET} matches pyproject version ${version}"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Assert exactly one release wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::expected exactly one release wheel, found ${#wheels[@]}"
            exit 1
          fi
      # PyPI files are immutable; GitHub Release assets are not, and this build
      # is not byte-reproducible (setuptools stamps wall-clock mtimes into the
      # wheel zip and the sdist tar; SOURCE_DATE_EPOCH clamps the wheel but not
      # the sdist). A rebuild of an already-published version is therefore
      # content-identical but byte-different, and unguarded it goes on to
      # replace release assets that did match PyPI. Reconcile against PyPI here
      # -- before provenance, the SBOM, publication and signing -- so that no
      # consumer of `release-dist` can ever see bytes PyPI does not serve.
      #
      # Exactly four states, and each has one correct outcome:
      #   ABSENT   this version has no PyPI files. First publication: keep this
      #            build, attest it, publish it, release it.
      #   COMPLETE PyPI's file set equals this build's exactly. Adopt the
      #            published bytes verbatim; this run publishes nothing new.
      #   CONFLICT PyPI holds a filename this build did not produce. The
      #            published set is not the one this workflow builds, so
      #            nothing can be adopted without guessing. Fail closed
      #            before downloading anything.
      #   PARTIAL  PyPI holds some but not all of them. Completing the version
      #            from THIS build would pair an original artifact with one from
      #            a different build, and would then attest and release that
      #            mixture. Fail closed and send the operator back to the run
      #            that produced the published files, whose release-dist
      #            artifact still holds the original missing member.
      #
      # This step is reached only when the build job runs, i.e. on a fresh
      # dispatch, a tag push, or "Re-run all jobs". Re-running only the FAILED
      # jobs of the original run does not re-execute build, so the retained
      # original release-dist is reused untouched and this guard is correctly
      # bypassed -- that is the supported recovery path for PARTIAL.
      #
      # No wheel is installed and no project code runs, so this job's isolation
      # from the runtime dependency graph is unchanged.
      - name: Reconcile dist against PyPI (absent / complete / partial)
        id: pypi
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, pathlib, sys, urllib.error, urllib.request

          dist = pathlib.Path("dist")
          built = sorted(p.name for p in dist.iterdir() if p.is_file())
          wheel = next(n for n in built if n.endswith(".whl"))
          project, version = wheel.split("-")[0], wheel.split("-")[1]

          def emit(adopted):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write(f"adopted={'true' if adopted else 'false'}\n")

          try:
              meta = json.load(urllib.request.urlopen(
                  f"https://pypi.org/pypi/{project}/{version}/json", timeout=60))
              published = {u["filename"]: (u["digests"]["sha256"], u["url"])
                           for u in meta["urls"]}
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              published = {}

          if not published:
              print(f"ABSENT: {project} {version} has no files on PyPI. "
                    "Publishing this build as its first publication.")
              emit(False)
              sys.exit(0)

          unexpected = sorted(name for name in published if name not in built)
          if unexpected:
              print(f"::error::CONFLICT: PyPI holds {unexpected} for "
                    f"{project} {version}, which this build did not produce. "
                    "This version's published file set is not the one this "
                    "workflow builds, so nothing here can be adopted or "
                    "reconciled without guessing. Refusing before downloading "
                    "anything. Investigate the published file set by hand.")
              sys.exit(1)

          missing = sorted(name for name in built if name not in published)
          if missing:
              print(f"::error::PARTIAL: PyPI holds {sorted(published)} for "
                    f"{project} {version} but not {missing}. Those published "
                    "files are immutable and came from a different build than "
                    "this one, so completing the version from this build would "
                    "publish, attest and release a mixture of two builds. "
                    "Refusing. Recover instead by re-running the FAILED JOBS of "
                    "the workflow run that published the existing files: that "
                    "does not re-execute this build job, so its retained "
                    "release-dist artifact supplies the original missing "
                    "member. Do not use 'Re-run all jobs' and do not dispatch "
                    "this workflow again for this version.")
              sys.exit(1)

          # Reaching here means set(published) == set(built) exactly: nothing
          # missing (PARTIAL) and nothing extra (CONFLICT).
          print(f"::warning::COMPLETE: {project} {version} is already fully "
                f"published on PyPI as {sorted(published)}. Those files are "
                "immutable, so this run discards its own rebuild and adopts "
                "the published bytes verbatim.")
          for name, (want, href) in sorted(published.items()):
              blob = urllib.request.urlopen(href, timeout=300).read()
              got = hashlib.sha256(blob).hexdigest()
              if got != want:
                  print(f"::error::{name}: downloaded sha256 {got} != PyPI "
                        f"sha256 {want}")
                  sys.exit(1)
              (dist / name).write_bytes(blob)
              print(f"{name}: sha256 {got} (adopted from PyPI)")
          emit(True)
          PY
      # Build provenance asserts that THIS run produced these bytes. On the
      # COMPLETE path it did not -- it downloaded them -- and PyPI already holds
      # the PEP 740 provenance for those exact digests. Minting a second, false
      # SLSA statement here would be the opposite of the integrity this job
      # exists to provide. ABSENT still attests, because there the run really
      # did build the artifacts; PARTIAL never reaches this step.
      - name: Provenance attestation (dist)
        if: steps.pypi.outputs.adopted != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dist
          path: dist/

  # Unprivileged by design: installing the wheel resolves and executes
  # third-party package installs, so this job gets no id-token, no
  # attestations, no write access of any kind.
  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Generate CycloneDX SBOM from exact release wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::expected exactly one release wheel, found ${#wheels[@]}"
            exit 1
          fi
          wheel="${wheels[0]}"

          python -m pip install --upgrade pip cyclonedx-bom

          # Keep build tooling out of the analyzed environment. pip's --python
          # option installs the exact wheel and its resolved runtime graph into
          # a venv that was created without pip.
          python -m venv --without-pip .sbom-runtime
          python -m pip --python .sbom-runtime install "$wheel"

          cyclonedx-py environment .sbom-runtime/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --output-format JSON \
            --output-file sbom.cdx.json
          python scripts/bind_release_sbom.py --sbom sbom.cdx.json --wheel "$wheel"
      - name: Independently verify SBOM root against exact wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::expected exactly one release wheel, found ${#wheels[@]}"
            exit 1
          fi
          python scripts/bind_release_sbom.py --verify-only --sbom sbom.cdx.json --wheel "${wheels[0]}"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-sbom
          path: sbom.cdx.json

  # The only privileged SBOM step. It consumes the already-built wheel and the
  # already-verified SBOM; it installs no packages, resolves no dependencies,
  # and executes no project code. The SBOM describes the installed wheel's
  # runtime closure, so it is attested to the wheel subject only — never the
  # sdist.
  attest-sbom:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # attestation OIDC
      attestations: write   # actions/attest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-sbom
          path: .
      # Skipped on the COMPLETE path. The SBOM above is regenerated with
      # today's dependency resolution, so it can name different transitive
      # versions than the closure the released wheel was published with;
      # attesting it would mint permanent evidence for a graph that is not the
      # one shipped. Generating and binding it still runs as transient
      # verification of the adopted wheel -- only the permanent record is
      # withheld. Only this step is gated, never the job: publish-pypi needs
      # it to complete so its post-PyPI verification still runs on COMPLETE.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        if: needs.build.outputs.adopted != 'true'
        env:
          NODE_OPTIONS: '--max-http-header-size=32768'
        with:
          subject-path: "dist/*.whl"
          # Custom predicate mode preserves the native CycloneDX predicate
          # semantics while bypassing the action's stricter than specification
          # SBOM detector, which requires serialNumber even though the valid
          # reproducible CycloneDX document intentionally omits it.
          predicate-type: "https://cyclonedx.org/bom"
          predicate-path: "sbom.cdx.json"

  publish-pypi:
    # Publication waits for the full integrity chain: build provenance
    # (build), SBOM generation + verification (sbom), and the wheel-bound
    # SBOM attestation (attest-sbom).
    needs: [build, sbom, attest-sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # PyPI Trusted Publishing OIDC
    environment:
      name: pypi
      url: https://pypi.org/project/groupoid/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      # `skip-existing` decides purely on the server's 409; twine never fetches
      # a remote digest, so on its own it will happily skip a file whose bytes
      # differ from the published one and report success. That is exactly what
      # run 32427167884 did. This step supplies the missing comparison, and it
      # is the load-bearing check on the same-run retry path, where the build
      # job did not re-execute and dist/ is the ORIGINAL release-dist artifact:
      # PyPI must hold no filename that artifact lacks, every filename it does
      # hold must match byte-for-byte, and only then are the genuinely missing
      # files left for the upload below.
      - name: Hash-verify already-published filenames before uploading
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, sys, urllib.error, urllib.request

          dist = pathlib.Path("dist")
          local = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in sorted(dist.iterdir()) if p.is_file()}
          wheel = next(n for n in local if n.endswith(".whl"))
          project, version = wheel.split("-")[0], wheel.split("-")[1]

          try:
              meta = json.load(urllib.request.urlopen(
                  f"https://pypi.org/pypi/{project}/{version}/json", timeout=60))
              published = {u["filename"]: u["digests"]["sha256"] for u in meta["urls"]}
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              published = {}

          # Checked first, and fatal on its own: the build job's CONFLICT guard
          # is deliberately bypassed by a same-run "Re-run failed jobs", which
          # does not re-execute build. This is then the only place an
          # unexpected published filename can be caught, and it must be caught
          # before any local gap is reported or offered to twine.
          unexpected = sorted(set(published) - set(local))
          if unexpected:
              print(f"::error::CONFLICT: PyPI holds {unexpected} for "
                    f"{project} {version}, which is not in this run's dist/. "
                    "On a retry that dist/ is the retained original "
                    "release-dist, so a file PyPI has and it does not cannot "
                    "have come from the build this release is being assembled "
                    "from. Refusing to upload or release anything for this "
                    "version. Investigate the published file set by hand.")
              sys.exit(1)

          failed = False
          for name in sorted(set(local) & set(published)):
              if local[name] != published[name]:
                  print(f"::error::{name} is already on PyPI with sha256 "
                        f"{published[name]}, but this run holds {local[name]}. "
                        "PyPI files are immutable; refusing to publish or "
                        "release bytes that differ from the published artifact.")
                  failed = True
              else:
                  print(f"{name}: already on PyPI, sha256 {local[name]} verified")
          for name in sorted(set(local) - set(published)):
              print(f"{name}: not yet on PyPI; this run will upload it")
          sys.exit(1 if failed else 0)
          PY
      # Skipped on the COMPLETE path: dist/ IS what PyPI already serves, so
      # there is nothing to upload. Running the action anyway would mint and
      # publicly log PEP 740 publish attestations for files it then skips --
      # the orphan Rekor entries run 32427167884 left behind. The verification
      # step below still runs, so COMPLETE still proves PyPI is correct.
      - name: Publish to PyPI (Trusted Publishing, OIDC)
        if: needs.build.outputs.adopted != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: dist
          print-hash: true
          # Idempotent: a re-dispatch or an out-of-band manual republish of a
          # version already on PyPI should not fail the job. Safe only because
          # the step above has already proved that every filename PyPI holds is
          # byte-identical to this run's copy, so what twine skips here can no
          # longer be a divergent artifact.
          skip-existing: true
      # Closes the loop the other direction: after the upload, every file this
      # run is about to attach to the GitHub Release must be on PyPI under the
      # same name AND the same SHA-256, and PyPI must hold nothing else for
      # this version.
      - name: Verify the complete PyPI file set against these exact bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, sys, time, urllib.error, urllib.request

          dist = pathlib.Path("dist")
          local = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in sorted(dist.iterdir()) if p.is_file()}
          wheel = next(n for n in local if n.endswith(".whl"))
          project, version = wheel.split("-")[0], wheel.split("-")[1]
          url = f"https://pypi.org/pypi/{project}/{version}/json"

          published = {}
          for attempt in range(6):
              if attempt:
                  time.sleep(10)
              try:
                  meta = json.load(urllib.request.urlopen(url, timeout=60))
              except urllib.error.HTTPError as exc:
                  if exc.code != 404:
                      raise
                  continue
              published = {u["filename"]: u["digests"]["sha256"] for u in meta["urls"]}
              if set(local) <= set(published):
                  break

          failed = False
          for name in sorted(set(local) - set(published)):
              print(f"::error::{name} is absent from PyPI after publication")
              failed = True
          for name in sorted(set(published) - set(local)):
              print(f"::error::PyPI holds {name} for {project} {version}, which "
                    "this run neither built nor adopted")
              failed = True
          for name in sorted(set(local) & set(published)):
              if local[name] != published[name]:
                  print(f"::error::{name}: local sha256 {local[name]} != PyPI "
                        f"sha256 {published[name]}")
                  failed = True
              else:
                  print(f"{name}: sha256 {local[name]} verified against PyPI")
          sys.exit(1 if failed else 0)
          PY

  sign-and-release:
    # publish-pypi is a hard dependency, not a peer: the assets attached here
    # are exactly the bytes PyPI has accepted and this run has re-verified
    # against PyPI, so a GitHub Release can never be created ahead of -- or
    # instead of -- the publication whose bytes it claims to mirror.
    needs: [build, sbom, attest-sbom, publish-pypi]
    # On a real tag push, or an explicit request via create_github_release=true
    # (see auto-tag-release.yml, which dispatches this workflow with that flag
    # set for a version's first release, since GitHub suppresses push-triggered
    # workflow runs caused by its own GITHUB_TOKEN). A plain workflow_dispatch
    # republish (create_github_release left at its false default) must NOT
    # create a duplicate GitHub Release or trigger a second Zenodo deposit.
    # Never on the COMPLETE path: that version's release already exists, and
    # re-running this job would re-sign it and overwrite its asset set -- the
    # exact mutable-release failure this workflow now exists to prevent. A
    # same-run "Re-run failed jobs" recovery keeps the original build's
    # adopted=false, so a release interrupted mid-run can still be completed.
    if: >-
      (github.event_name == 'push' || github.event.inputs.create_github_release == 'true')
      && needs.build.outputs.adopted != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create GitHub Release
      id-token: write       # Sigstore signing OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-sbom
          path: .
      # `ref` is a free-text input and github.ref_name is a branch name on a
      # dispatch, so without this a blank or wrong input creates a release
      # tagged after a branch (e.g. "main") instead of the version.
      - name: Assert the release target is a version tag that exists
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          case "${RELEASE_TAG}" in
            v[0-9]*) ;;
            *) echo "::error::refusing to create a GitHub Release for '${RELEASE_TAG}': not a v<version> tag"; exit 1 ;;
          esac
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          echo "release target ${RELEASE_TAG} -> $(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: |
            dist/*.tar.gz
            dist/*.whl
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          # Explicit rather than relying on ref inference: on a tag push
          # github.ref_name is already the tag, but being explicit keeps this
          # correct regardless of trigger type.
          tag_name: ${{ github.event.inputs.ref || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
            sbom.cdx.json
            *.sigstore.json
