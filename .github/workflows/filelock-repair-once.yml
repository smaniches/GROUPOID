name: Prepare FileLock security prerelease
on:
  push:
    branches: [fix/filelock-security-20261023]
    paths: [.github/workflows/filelock-repair-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/filelock-security-20261023
      - name: Constrain affected dependency without changing research code
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import json,tomllib
          p=Path('pyproject.toml'); text=p.read_text(); assert text.count('    "torch>=2.0",')==1
          text=text.replace('    "torch>=2.0",','    "torch>=2.0",\n    # CVE-2026-112940: predates the affected SQLite lock feature.\n    # Compatible with Python 3.10 and PyTorch\'s FileLock <4 constraint.\n    "filelock==3.20.3",').replace('version = "0.1.0.dev6"','version = "0.1.0.dev7"'); p.write_text(text)
          for name in ['groupoid/__init__.py','CITATION.cff','STATUS.md']:
              p=Path(name); p.write_text(p.read_text().replace('0.1.0.dev6','0.1.0.dev7'))
          for name in ['.zenodo.json','codemeta.json']:
              p=Path(name); data=json.loads(p.read_text()); data['version']='0.1.0.dev7'; p.write_text(json.dumps(data,indent=2)+'\n')
          p=Path('CHANGELOG.md'); text=p.read_text(); text=text.replace('## [Unreleased]\n','## [Unreleased]\n\n## [0.1.0.dev7]\n\nSecurity-only prerelease. Constrain the PyTorch FileLock dependency to 3.20.3, which predates the SQLite lock feature affected by CVE-2026-112940 and supports the existing Python 3.10-3.12 range. Revisit when PyTorch supports patched FileLock >=4.2.1. No aggregation, transport, diagnostic, stored benchmark, or preregistration is changed.\n',1); text=text.replace('[Unreleased]: https://github.com/smaniches/GROUPOID/compare/v0.1.0.dev6...HEAD','[Unreleased]: https://github.com/smaniches/GROUPOID/compare/v0.1.0.dev7...HEAD\n[0.1.0.dev7]: https://github.com/smaniches/GROUPOID/compare/v0.1.0.dev6...v0.1.0.dev7'); p.write_text(text)
          p=Path('SECURITY.md'); text=p.read_text()
          text=text.replace('The\n  advisory concerns crafted-checkpoint / JIT deserialization (`torch.load` and\n  related paths), which GROUPOID\'s own code does not exercise.','The\n  upstream report concerns `torch.jit.script` memory corruption, not a general\n  claim about every `torch.load` call. GROUPOID does not call `torch.jit.script`.\n  This exception is not a statement that arbitrary PyTorch inputs are safe.')
          text+='\n## FileLock compatibility constraint (2026-10-23)\n\nThe fresh PyTorch environment resolved FileLock 3.32.3, affected by CVE-2026-112940. The package now requires 3.20.3, which predates the affected SQLite locking feature and supports Python 3.10. This is a dependency constraint, not an advisory suppression. Revisit when the supported PyTorch range permits patched FileLock >=4.2.1. Reachability of the vulnerable SQLite lock path from GROUPOID was not established. Existing scanner exceptions above are separate and are not blanket security approval.\n\nAdvisory: https://github.com/tox-dev/filelock/security/advisories/GHSA-v4x8-3wr5-3wq8\n'; p.write_text(text)
          assert 'filelock==3.20.3' in tomllib.loads(Path('pyproject.toml').read_text())['project']['dependencies']
          PY
          git add pyproject.toml groupoid/__init__.py CITATION.cff STATUS.md .zenodo.json codemeta.json CHANGELOG.md SECURITY.md
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'fix(security): constrain FileLock and prepare 0.1.0.dev7'
          git push origin HEAD:fix/filelock-security-20261023
