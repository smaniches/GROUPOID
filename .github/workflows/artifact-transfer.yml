name: Artifact transfer integrity

on:
  push:
    branches: [main]
    paths: [".github/workflows/**"]
  pull_request:
    branches: [main]
    paths: [".github/workflows/**"]

permissions:
  contents: read

jobs:
  round-trip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create fixture and independent expected checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/nested
          printf '%s\n' "$GITHUB_SHA" > payload/nested/fixture.txt
          (cd payload && sha256sum nested/fixture.txt) > expected.sha256
      - name: Upload fixture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-transfer-proof
          path: payload/
          if-no-files-found: error
          retention-days: 1
      - name: Remove original fixture before downloading
        run: rm -r payload
      - name: Download fixture
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifact-transfer-proof
          path: restored/
      - name: Verify restored bytes and directory layout
        shell: bash
        run: |
          set -euo pipefail
          cd restored
          test "$(find . -type f | wc -l)" -eq 1
          sha256sum --check ../expected.sha256
