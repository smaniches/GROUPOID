name: Recover v0.1.0.dev6 GitHub Release from original artifacts

# Runs only when this one-time recovery workflow is added to main.
# Every run must prove original PyPI bytes, original tag, and no existing release.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-dev6-github-release.yml

permissions: {}

concurrency:
  group: groupoid-one-time-recovery-v0.1.0.dev6
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'smaniches/GROUPOID' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Check out the original published dev6 commit, not main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.1.0.dev6
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable release identity and missing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import urllib.error
          import urllib.request

          repo = 'smaniches/GROUPOID'
          version = 'v0.1.0.dev6'
          commit = '4f621f38a5563225a3b50dde60758590a6e51a1e'
          annotated_tag = '26decf0e07223437e9ed60f2f796d61d6df5ef9b'

          if os.environ['GITHUB_REPOSITORY'] != repo:
              raise SystemExit('Wrong repository')
          current = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if current != commit:
              raise SystemExit(f'Wrong checkout commit {current} != {commit}')
          if 'version = "0.1.0.dev6"' not in pathlib.Path('pyproject.toml').read_text():
              raise SystemExit('Wrong package version')

          def api(path):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/{path}',
                  headers={
                      'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.load(response)

          remote_tag = api(f'git/ref/tags/{version}')
          if remote_tag['object']['sha'] != annotated_tag:
              raise SystemExit('Original release tag was moved')
          remote_main = api('git/ref/heads/main')['object']['sha']
          if remote_main != os.environ['RECOVERY_MAIN_SHA']:
              raise SystemExit('main advanced since recovery was triggered')
          try:
              api(f'releases/tags/{version}')
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          else:
              raise SystemExit('Release already exists; no recovery needed')
          print('Original tag and commit verified; release absent')
          PY

      - name: Retrieve original dev6 build artifacts without rebuilding
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          run-id: 38763982105
          repository: smaniches/GROUPOID
          github-token: ${{ github.token }}
          path: dist

      - name: Retrieve original wheel-bound CycloneDX SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          run-id: 38763982105
          repository: smaniches/GROUPOID
          github-token: ${{ github.token }}
          path: .

      - name: Verify exact original distribution hashes and PyPI file set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import urllib.request

          expected = {
              'groupoid-0.1.0.dev6-py3-none-any.whl': '0597100748678e9f769da9f6f6e0f408c68520829ef6a18b0d3d3178db012741',
              'groupoid-0.1.0.dev6.tar.gz': '5b76182ad5a7343df43390c343057e1f9541f56911eb0aabfb22c5e4692fd01b',
          }
          dist = pathlib.Path('dist')
          files = {p.name: p for p in dist.iterdir() if p.is_file()}
          if set(files) != set(expected):
              raise SystemExit(f'Original artifact file set differs: {sorted(files)}')
          for name, path in sorted(files.items()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != expected[name]:
                  raise SystemExit(f'Original artifact mismatch: {name}')

          with urllib.request.urlopen('https://pypi.org/pypi/groupoid/0.1.0.dev6/json', timeout=60) as response:
              data = json.load(response)
          published = {item['filename']: item['digests']['sha256'] for item in data['urls']}
          if published != expected:
              raise SystemExit(f'PyPI file set or hashes differ: {published}')
          print('Both original distribution files match PyPI exactly')
          PY

      - name: Verify original SBOM binding to the exact wheel
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bind_release_sbom.py --verify-only --sbom sbom.cdx.json --wheel dist/groupoid-0.1.0.dev6-py3-none-any.whl

      - name: Sign original published distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: |
            dist/*.tar.gz
            dist/*.whl

      - name: Final guard against duplicate release or modified PyPI files
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_MAIN_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          def fetch(url, *, auth=False):
              headers = {'Accept': 'application/vnd.github+json'} if auth else {}
              if auth:
                  headers['Authorization'] = f'Bearer {os.environ["GH_TOKEN"]}'
                  headers['X-GitHub-Api-Version'] = '2022-11-28'
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as response:
                  return json.load(response)

          api = 'https://api.github.com/repos/smaniches/GROUPOID'
          if fetch(f'{api}/git/ref/heads/main', auth=True)['object']['sha'] != os.environ['RECOVERY_MAIN_SHA']:
              raise SystemExit('main advanced before recovery release creation')
          if fetch(f'{api}/git/ref/tags/v0.1.0.dev6', auth=True)['object']['sha'] != '26decf0e07223437e9ed60f2f796d61d6df5ef9b':
              raise SystemExit('dev6 tag moved before release creation')
          try:
              fetch(f'{api}/releases/tags/v0.1.0.dev6', auth=True)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          else:
              raise SystemExit('Release appeared while recovery ran; refusing duplicate')
          expected = {
              'groupoid-0.1.0.dev6-py3-none-any.whl': '0597100748678e9f769da9f6f6e0f408c68520829ef6a18b0d3d3178db012741',
              'groupoid-0.1.0.dev6.tar.gz': '5b76182ad5a7343df43390c343057e1f9541f56911eb0aabfb22c5e4692fd01b',
          }
          data = fetch('https://pypi.org/pypi/groupoid/0.1.0.dev6/json')
          published = {x['filename']: x['digests']['sha256'] for x in data['urls']}
          if published != expected:
              raise SystemExit('Published files changed or mismatch')
          for name, expected_hash in expected.items():
              if hashlib.sha256((pathlib.Path('dist') / name).read_bytes()).hexdigest() != expected_hash:
                  raise SystemExit(f'Original distribution changed: {name}')
          print('Final pre-release checks passed')
          PY

      - name: Create GitHub prerelease from verified original files
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v0.1.0.dev6
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.whl
            sbom.cdx.json
            *.sigstore.json
