name: Auto Tag Release

# Creates the tag for a release-cut merge to main, then explicitly dispatches
# release.yml (build, attestations, PyPI publish, signing, GitHub Release)
# against that tag.
#
# The dispatch is explicit, not a tag-push trigger, because GitHub suppresses
# push-triggered workflow runs caused by a GITHUB_TOKEN-authored push: pushing
# the tag here does NOT cause release.yml's `on.push.tags` trigger to fire.
# workflow_dispatch is the documented exception to that suppression, which is
# why this workflow calls `gh workflow run` instead of relying on the tag
# push itself. (An earlier version of this workflow assumed the tag push
# alone would trigger release.yml; it did not, and no release was produced
# for v0.1.0.dev4 until this was fixed and the release re-run manually.)
#
# release.yml's own `push.tags` trigger remains as a fallback/manual path
# (a human pushing a tag with their own credentials is not subject to this
# suppression), alongside its `workflow_dispatch` trigger for republishing an
# existing tag to PyPI only.
#
# If a version needs a tag this workflow's format check rejects (see below),
# tag it manually -- this automation only ever creates a tag when one is
# missing, so a pre-existing manual tag always takes precedence and this
# workflow becomes a no-op for that version.

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag
      actions: write    # dispatch release.yml via `gh workflow run`
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # need full tag history to check for an existing tag

      - name: Create the release tag if this version doesn't have one yet, and dispatch the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(grep -m1 '^version = "' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ -z "${version}" ]; then
            echo "::error::could not extract a version from pyproject.toml"
            exit 1
          fi

          # PEP 440-ish release/pre-release only: X.Y.Z, optionally with
          # .devN / aN / bN / rcN. No local version segment (+...), no
          # anything else. A version that doesn't match this is presumably
          # intentional and unusual enough to want a human tagging it by
          # hand rather than this automation guessing.
          if ! echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.dev[0-9]+|a[0-9]+|b[0-9]+|rc[0-9]+)?$'; then
            echo "::error::version '${version}' is not a recognized release format (expected X.Y.Z, optionally with .devN/aN/bN/rcN, no local metadata); refusing to tag automatically. Tag it manually if this is intentional."
            exit 1
          fi

          tag="v${version}"

          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to do."
            exit 0
          fi

          if ! grep -qF "[${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [${version}] heading; refusing to tag an undocumented release. Add the changelog section as part of the version-bump PR."
            exit 1
          fi

          echo "Version ${version} has no matching tag; creating ${tag}."
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "refs/tags/${tag}"

          echo "Dispatching release.yml for ${tag}."
          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${tag}" \
            -f "ref=${tag}" \
            -f "create_github_release=true"
